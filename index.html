<title>Scale Space SeedBank</title>
<meta name="description" content="A registry of grains — coordinates found in Scale Space, kept so anyone can go back to them.">
<style>
  /* Tokens follow the games' Synthesist theme: amber on black, JetBrains Mono, scanlines. */
  :root {
    --accent-rgb: 255, 170, 85;
    --scan-rgb: 255, 200, 130;
    --ink: #e8e2d6;
    --ink-dim: rgba(232, 226, 214, .62);
    --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: var(--mono); }
  body { overflow: hidden; }

  /* The deck: one screen per grain, snapping. */
  #deck { height: 100dvh; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior: contain; touch-action: pan-x; }
  #deck::-webkit-scrollbar { display: none; }
  .grain { position: relative; touch-action: pan-x; flex: 0 0 100%; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; isolation: isolate; }

  /* Hero layers. The blur-up thumb sits under the full image; the image moves at parallax speed. */
  .hero { position: absolute; inset: 0 -14%; z-index: 0; will-change: transform; }
  .hero .thumb, .hero .full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero .thumb { filter: blur(18px) saturate(1.1); transform: scale(1.06); }
  .hero .full { opacity: 0; transition: opacity 1.6s ease; }
  .hero .full.loaded { opacity: 1; }
  .hero .in { cursor: pointer; }
  .grain::after { /* scanlines, same idea as the games' screen overlay */
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(var(--scan-rgb), .045) 0 1px, transparent 1px 3px);
    mix-blend-mode: screen;
  }
  .shade { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.55) 0, transparent 22%, transparent 55%, rgba(0,0,0,.72) 100%); }

  /* The panel is the caption. Collapsed it sits at the bottom as the grain's name;
     dragged or tapped up, it grows into the detail view and the hero steps back. */
  .panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; height: 64dvh; touch-action: pan-x;
    display: grid; grid-template-rows: auto 1fr; transform: translateY(var(--closed, 60dvh));
    transition: transform .42s cubic-bezier(.2,.8,.2,1), background-color .42s; will-change: transform;
    background-color: rgba(11,9,8,0); }
  .grain.open .panel { transform: translateY(0); background-color: rgba(11,9,8,.94); }
  .grain.open .panel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(var(--accent-rgb), .35); }
  .cap { padding: 22px 20px 26px; display: grid; gap: 6px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .grain.open .cap { padding-bottom: 14px; }
  .cap .id { font-size: 12px; color: rgb(var(--accent-rgb)); letter-spacing: .06em; }
  .cap h2 { margin: 0; font-size: clamp(26px, 7vw, 44px); font-weight: 500; line-height: 1.05; letter-spacing: -.01em;
    transition: font-size .42s; }
  .grain.open .cap h2 { font-size: clamp(20px, 5vw, 28px); }
  .cap .by { font-size: 13px; color: var(--ink-dim); }
  .cap .grip { width: 36px; height: 3px; border-radius: 2px; background: rgba(var(--accent-rgb), .5); margin: 0 auto 8px; opacity: .55; }
  .detail { padding: 0 20px calc(22px + env(safe-area-inset-bottom)); overflow: auto; overscroll-behavior: contain; touch-action: pan-y;
    opacity: 0; transition: opacity .3s .1s; }
  .grain.open .detail { opacity: 1; }
  .detail p { font-size: 13px; line-height: 1.55; max-width: 60ch; margin: 0 0 14px; }
  .detail .code { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 0 0 14px; }
  .detail pre { margin: 0; font: inherit; font-size: 11px; line-height: 1.4; color: var(--ink-dim); background: rgba(255,255,255,.04);
    border: 1px solid rgba(var(--accent-rgb), .18); border-radius: 3px; padding: 8px 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .detail button, .detail a.btn { appearance: none; font: inherit; font-size: 13px; padding: 9px 14px; border-radius: 3px; cursor: pointer; text-decoration: none;
    background: rgba(var(--accent-rgb), .08); border: 1px solid rgba(var(--accent-rgb), .45); color: rgb(var(--accent-rgb)); display: inline-block; }
  .detail button:focus-visible, .detail a:focus-visible, .cap:focus-visible { outline: 2px solid rgb(var(--accent-rgb)); outline-offset: 2px; }
  .detail .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .detail .note { font-size: 11px; color: var(--ink-dim); line-height: 1.5; } .detail .note a { color: rgb(var(--accent-rgb)); }
  .grain.dragging .panel, .grain.dragging .hero .in { transition: none; }
  .detail h4 { margin: 18px 0 8px; font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .media { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 6px; }
  .media::-webkit-scrollbar { display: none; }
  .media > * { flex: 0 0 auto; width: 132px; height: 82px; border-radius: 3px; overflow: hidden; border: 1px solid rgba(var(--accent-rgb), .18);
    background: #000; position: relative; padding: 0; cursor: pointer; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media .lbl { position: absolute; left: 8px; bottom: 6px; font-size: 10px; color: var(--ink-dim); letter-spacing: .06em; }
  .media .yt::after { content: "▶"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 22px;
    background: rgba(0,0,0,.25); text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  .media .yt.playing::after { content: none; }
  .media .yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .media .yt.playing { width: 100%; height: auto; aspect-ratio: 16/9; }
  .coords { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 16px; font-size: 12px; margin: 0; }
  .coords div { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .coords dt { color: var(--ink-dim); } .coords dd { margin: 0; font-variant-numeric: tabular-nums; }
  .optics { font-size: 11px; color: var(--ink-dim); line-height: 1.7; columns: 2; column-gap: 16px; margin: 6px 0 0; }
  .optics span { display: block; break-inside: avoid; } .optics b { font-weight: 500; color: var(--ink); }
  details summary { cursor: pointer; font-size: 11px; color: rgb(var(--accent-rgb)); list-style: none; margin-top: 8px; }
  details summary::before { content: "+ "; } details[open] summary::before { content: "− "; }
  #lightbox { position: fixed; inset: 0; z-index: 9; background: #000; display: none; overflow: hidden; touch-action: pan-y; }
  #lightbox.on { display: block; }
  #lightbox img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; will-change: transform; }
  #lightbox img.on { opacity: 1; }
  #lightbox img.anim { transition: transform .32s cubic-bezier(.2,.8,.2,1), opacity .32s; }
  #lightbox .n, #lightbox .x { z-index: 2; }
  #lightbox .n { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 16px; font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  #lightbox .x { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 12px; background: none; border: 0; color: var(--ink-dim); font: inherit; font-size: 24px; cursor: pointer; padding: 4px 8px; }
  .detail .cta { display: block; text-align: center; margin-top: 22px; padding: 13px 16px; border-radius: 3px; text-decoration: none;
    font-size: 13px; letter-spacing: .04em; color: rgb(var(--accent-rgb)); background: rgba(var(--accent-rgb), .08);
    border: 1px solid rgba(var(--accent-rgb), .45); }
  .detail .copy svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; }

  /* Hero steps back when the panel opens. Parallax lives on .hero, the open-state on .in, so they don't fight. */
  .hero .in { position: absolute; inset: 0; transition: transform .42s cubic-bezier(.2,.8,.2,1), filter .42s; }
  .grain.open .hero .in { transform: translateY(-9%) scale(.94); filter: brightness(.55); }

  /* Wordmark + position, top. */
  #top { position: fixed; top: 0; left: 0; right: 0; z-index: 3; display: flex; justify-content: space-between; align-items: baseline;
    padding: calc(14px + env(safe-area-inset-top)) 20px 0; font-size: 12px; pointer-events: none; }
  #top .mark { color: var(--ink); }
  #top .mark b { font-weight: 500; color: rgb(var(--accent-rgb)); }
  #top .pos { color: var(--ink-dim); font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) { .hero { will-change: auto; } .hero .full, .panel, .hero .in, .cap h2, .detail { transition: none; } }
  @media (min-width: 900px) { .cap, .detail { padding-left: 48px; padding-right: 48px; } #top { padding-left: 48px; padding-right: 48px; } .panel { height: 60dvh; } }
