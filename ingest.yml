name: Ingest grain
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
jobs:
  ingest:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'grain')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save sharp@0.33
      - name: Ingest
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/ingest.mjs
      - name: Commit
        run: |
          git config user.name "seedbank-bot"
          git config user.email "seedbank-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "grain: $(cat .ingest-slug) (#$ISSUE_NUMBER)"
          git push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
      - name: Close issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          SLUG=$(cat .ingest-slug); OWNER=${REPO%%/*}; NAME=${REPO##*/}
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Planted. https://$OWNER.github.io/$NAME/?g=$SLUG"
          gh issue close "$ISSUE_NUMBER" --repo "$REPO"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          MSG=$(cat .ingest-error 2>/dev/null || echo "ingest failed; see the Actions log")
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Couldn't plant this one: $MSG"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label approved
